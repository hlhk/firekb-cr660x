name: Build Firekb CR660X

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '设备型号'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - xiaomi_mi-router-cr6606
          - xiaomi_mi-router-cr6608
          - xiaomi_mi-router-cr6609
  push:
    branches:
      - main
    paths:
      - 'diy.sh'
      - '.github/workflows/build.yml'
      - 'files/**'
      - 'config.seed'

jobs:
  build:
    name: Ramips MT7621 (CR660X)
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 签出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pip rsync unzip \
            zlib1g-dev file wget ccache subversion

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-cr660x-${{ github.sha }}
          restore-keys: |
            ccache-cr660x-

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log --oneline -1

      - name: 配置 ccache
        run: |
          mkdir -p ~/.ccache
          cat > ~/.ccache/ccache.conf <<'EOF'
          max_size = 5G
          compression = true
          compression_level = 6
          EOF

      - name: 添加 feeds
        run: |
          cd openwrt
          cat > feeds.conf <<'EOF'
          src-git packages https://github.com/openwrt/packages.git;openwrt-25.12
          src-git luci https://github.com/openwrt/luci.git;openwrt-25.12
          src-git routing https://github.com/openwrt/routing.git;openwrt-25.12
          src-git telephony https://github.com/openwrt/telephony.git;openwrt-25.12
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git openclash https://github.com/vernesong/OpenClash.git;master
          src-git theme_vantage https://github.com/anothaDev/luci-theme-vantage.git;main
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 复制自定义文件
        run: |
          cd openwrt
          # 自研包
          mkdir -p package/luci-app-multi-wifi
          cp -r $GITHUB_WORKSPACE/files/package/luci-app-multi-wifi/. package/luci-app-multi-wifi/
          # 品牌 uci-defaults
          mkdir -p package/base-files/files/etc/uci-defaults
          cp $GITHUB_WORKSPACE/files/uci-defaults/99-firekb-custom \
             package/base-files/files/etc/uci-defaults/99-firekb-custom
          chmod +x package/base-files/files/etc/uci-defaults/99-firekb-custom
          echo "=== 已注入 ==="
          ls package/luci-app-multi-wifi
          ls package/base-files/files/etc/uci-defaults/

      - name: 应用 DIY 脚本
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/diy.sh .
          chmod +x diy.sh
          bash diy.sh

      - name: 加载种子配置
        run: |
          cd openwrt
          if [ -f "$GITHUB_WORKSPACE/config.seed" ]; then
            cp "$GITHUB_WORKSPACE/config.seed" .config
          fi
          make defconfig
          echo "=== target ==="
          grep -E 'CONFIG_TARGET_(BOARD|SUBTARGET)=' .config
          grep -E 'CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_xiaomi_mi-router-cr660' .config
          echo "=== 包数 ==="
          grep -c '^CONFIG_PACKAGE.*=y' .config

      - name: 下载依赖
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        run: |
          cd openwrt
          echo "CPU: $(nproc)"
          make -j$(nproc) || make -j1 V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: Firekb-CR660X-${{ github.run_number }}
          path: |
            openwrt/bin/targets/ramips/mt7621/*.bin
            openwrt/bin/targets/ramips/mt7621/*.buildinfo
            openwrt/bin/targets/ramips/mt7621/sha256sums
          if-no-files-found: error
          retention-days: 90