name: Build Firekb CR660X

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '构建类型'
        required: true
        default: 'minimal'
        type: choice
        options:
          - minimal
          - full
      profile:
        description: '设备型号'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - xiaomi_mi-router-cr6606
          - xiaomi_mi-router-cr6608
          - xiaomi_mi-router-cr6609
  push:
    branches:
      - main
    paths:
      - 'diy.sh'
      - '.github/workflows/build.yml'
      - 'files/**'
      - 'config.packages'

jobs:
  build:
    name: Ramips MT7621 (CR660X)
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 签出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pip rsync unzip \
            zlib1g-dev file wget ccache subversion

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-cr660x-${{ github.sha }}
          restore-keys: |
            ccache-cr660x-

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log --oneline -1

      - name: 配置 ccache
        run: |
          mkdir -p ~/.ccache
          cat > ~/.ccache/ccache.conf <<'EOF'
          max_size = 5G
          compression = true
          compression_level = 6
          EOF

      - name: 添加 feeds
        run: |
          cd openwrt
          cat > feeds.conf <<'EOF'
          src-git packages https://github.com/openwrt/packages.git;openwrt-25.12
          src-git luci https://github.com/openwrt/luci.git;openwrt-25.12
          src-git routing https://github.com/openwrt/routing.git;openwrt-25.12
          src-git telephony https://github.com/openwrt/telephony.git;openwrt-25.12
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git openclash https://github.com/vernesong/OpenClash.git;master
          src-git theme_vantage https://github.com/anothaDev/luci-theme-vantage.git;main
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 复制自定义文件
        run: |
          cd openwrt
          # 自研包
          mkdir -p package/luci-app-multi-wifi
          cp -r $GITHUB_WORKSPACE/files/package/luci-app-multi-wifi/. package/luci-app-multi-wifi/
          # 品牌 uci-defaults
          mkdir -p package/base-files/files/etc/uci-defaults
          cp $GITHUB_WORKSPACE/files/uci-defaults/99-firekb-custom \
             package/base-files/files/etc/uci-defaults/99-firekb-custom
          chmod +x package/base-files/files/etc/uci-defaults/99-firekb-custom
          # 确保脚本是 LF 换行且可执行
          file package/base-files/files/etc/uci-defaults/99-firekb-custom
          echo "=== 已注入 ==="
          ls package/luci-app-multi-wifi
          ls -la package/base-files/files/etc/uci-defaults/

      - name: 组装配置并校验
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/diy.sh .
          chmod +x diy.sh
          # push 触发时 github.event.inputs.flavor 为空。
          # 默认必须是 full —— 只有 full 才会读取 config.packages，
          # 用 minimal 会编出 11MB 的空壳固件（不含任何插件）。
          FLAVOR="${{ github.event.inputs.flavor }}"
          if [ -z "$FLAVOR" ]; then FLAVOR="full"; fi
          echo "构建类型: $FLAVOR"
          bash diy.sh "$FLAVOR"

      - name: 下载依赖
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        run: |
          cd openwrt
          echo "CPU: $(nproc)"
          make -j$(nproc) || make -j1 V=s

      - name: 校验产物（体积硬限制）
        run: |
          cd openwrt/bin/targets/ramips/mt7621 || exit 1
          echo "=== 产物清单 ==="
          ls -lh *.bin *.ubi 2>/dev/null || ls -lh *.bin

          echo ""
          echo "=== 体积校验 ==="
          fail=0

          # ---- PandoraBox U-Boot Recovery 分区布局 ----
          #   Kernel : 0x080000 ~ 0x0480000  (4.00 MB)
          #   RootFS : 0x0480000 ~ 0x03F80000 (59.00 MB / 472 PEB x 128KB)
          #   factory 镜像从 flash 0x080000 开始写入，文件偏移 0 == flash 0x080000
          #   => 文件最大 = 0x03F80000 - 0x080000 = 0x03F00000 = 66060288 (63.00 MB)
          FACTORY_LIMIT=66060288
          # 留 1.5MB 余量给坏块，超过就告警
          FACTORY_WARN=64500000
          # squashfs 起点固定为 4.25MB（uImage 补齐到 4MB + UBI 头）
          SQ_BASE=4456448

          # 内核分区只有 4MB，initramfs 必须远小于此
          for f in *initramfs-kernel.bin; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            mb=$((sz / 1048576))
            echo "  $f = ${mb} MB"
            if [ "$sz" -gt 20971520 ]; then
              echo "  ERROR: initramfs 超过 20MB，uboot TFTP 会加载失败"
              fail=1
            fi
          done

          # ★ factory 镜像：这个才是 PandoraBox 上传/刷写用的文件
          #   之前没有校验，导致 68.75MB 的固件被传上去又被 Uboot 拒绝
          for f in *squashfs-firmware.bin; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            mb=$(awk "BEGIN{printf \"%.2f\", $sz/1048576}")
            sqmb=$(awk "BEGIN{printf \"%.2f\", ($sz-$SQ_BASE)/1048576}")
            peb=$(( (sz + 131071) / 131072 ))
            echo "  $f = ${mb} MB  (squashfs ${sqmb} MB, ${peb} PEB / 上限 472)"
            if [ "$sz" -gt "$FACTORY_LIMIT" ]; then
              over=$(( (sz - FACTORY_LIMIT + 1048575) / 1048576 ))
              echo "  ERROR: factory 镜像超出 PandoraBox 分区 ${over} MB"
              echo "         U-Boot 会直接拒绝刷写，必须瘦身"
              fail=1
            elif [ "$sz" -gt "$FACTORY_WARN" ]; then
              echo "  WARNING: factory 镜像已接近分区上限，坏块多时会刷写失败"
            fi
          done

          # sysupgrade 走 UBI 卷，限制放宽
          for f in *squashfs-sysupgrade.bin; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            mb=$((sz / 1048576))
            echo "  $f = ${mb} MB"
            if [ "$sz" -gt 115343360 ]; then
              echo "  ERROR: sysupgrade 超过 110MB，塞不进 ubi 分区"
              fail=1
            fi
          done

          if [ "$fail" = "1" ]; then
            echo ""
            echo "产物校验失败，中止上传"
            exit 1
          fi
          echo ""
          echo "产物校验通过"

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: Firekb-CR660X-${{ github.event.inputs.flavor || 'full' }}-${{ github.run_number }}
          path: |
            openwrt/bin/targets/ramips/mt7621/*.bin
            openwrt/bin/targets/ramips/mt7621/*.buildinfo
            openwrt/bin/targets/ramips/mt7621/*.manifest
            openwrt/bin/targets/ramips/mt7621/sha256sums
          if-no-files-found: error
          retention-days: 90